<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Layered 2.5D Strike – Art Demo</title>
<style>

</style></head><body>
<canvas id="c"></canvas>
<div id="tag">LAYERED 2.5D DEMO · MOVE MOUSE / TILT FOR DEPTH · L = LAYER VIEW</div>
<div id="hud"><div id="bar"><div id="zone"></div><div id="core"></div><div id="mark"></div></div><div id="tip">TAP / SPACE — STRIKE WHEN THE MARKER HITS THE LIGHT</div></div>
<script>

const grass=[...Array(70)].map(()=>({x:sr()*W*1.2-100,h:14+sr()*30,b:sr()*6}));

const K=[[0,0,1.25,.35,0],[240,-.22,-2.35,-.55,7],[330,.32,.42,.05,15],[400,.32,.42,.05,15],[580,.4,.75,.2,17],[950,0,1.25,.35,0]];
const CONTACT=330,HOLD=400,DUR=950;

 const hip=[CX+p.lean*10,GY-98+p.cr+breath*1.5];
 const sh=[hip[0]+Math.sin(p.lean)*72,hip[1]-Math.cos(p.lean)*72+breath];

 const ta=p.sh+p.el+.25,dt=dir(ta),tip=[hand[0]+dt[0]*70,hand[1]+dt[1]*70],butt=[hand[0]-dt[0]*18,hand[1]-dt[1]*18];

const TIP=rig(pose(CONTACT),0).tip;const ORE={x:TIP[0]+38,y:GY,hp:0,crack:[],glow:0};

let aim=0,center=.5;function newTarget(){center=rnd(.25,.75);document.getElementById('zone').style.cssText=`left:${(center-.11)*100}%;width:22%`;document.getElementById('core').style.cssText=`left:${(center-.04)*100}%;width:8%`;}newTarget();

function burst(g){const n={PERFECT:46,GOOD:28,GLANCE:12,MISS:4}[g];const px=ORE.x-28,py=ORE.y-70;
 for(let i=0;i<n;i++){const front=Math.random()<.45;parts.push({x:px,y:py,vx:rnd(-3.5,2.5)*(g==='PERFECT'?1.5:1),vy:rnd(-7,-1.5),z:front?1:0,life:rnd(.7,1.6),max:1.6,r:rnd(1.5,4.5),kind:Math.random()<.6?'shard':'spark'});}
 for(let i=0;i<14;i++)parts.push({x:px+rnd(-20,20),y:GY-4,vx:rnd(-1.2,1.2),vy:rnd(-.8,-.2),z:Math.random()<.5?1:0,life:rnd(1,2),max:2,r:rnd(10,22),kind:'dust'});}
function contact(){const g=pendingGrade;grade=g;gradeT=1.4;combo=(g==='PERFECT'||g==='GOOD')?combo+1:0;
 if(g!=='MISS'){const n={PERFECT:3,GOOD:2,GLANCE:1}[g];for(let i=0;i<n;i++){let a=rnd(-Math.PI,0),pts=[[0,0]],cx=0,cy=0;for(let k=0;k<4;k++){cx+=Math.cos(a)*rnd(8,16);cy+=Math.sin(a)*rnd(8,16);a+=rnd(-.7,.7);pts.push([cx,cy]);}ORE.crack.push(pts);}ORE.crack=ORE.crack.slice(-14);}

 x.strokeStyle='rgba(255,190,160,.25)';x.lineWidth=2;x.beginPath();x.moveTo(-120,GY-30);x.bezierCurveTo(300,GY-50,700,GY-20,W+120,GY-40);x.stroke();
 for(let i=0;i<9;i++){x.strokeStyle=`rgba(0,0,0,${.12+i*.02})`;x.lineWidth=1;const y=GY+8+i*i*2.2;x.beginPath();x.moveTo(-100,y);x.lineTo(W+100,y+3);x.stroke();}
 const L=x.createRadialGradient(ORE.x-30,GY-20,5,ORE.x-30,GY,340);L.addColorStop(0,`rgba(120,230,255,${.22+ORE.glow*.35})`);L.addColorStop(1,'rgba(120,230,255,0)');x.fillStyle=L;x.fillRect(ORE.x-400,GY-200,800,360);}

 shapes.forEach(sh=>{x.beginPath();sh.forEach((p,k)=>k?x.lineTo(...p):x.moveTo(...p));x.closePath();const g=x.createLinearGradient(sh[1][0],sh[2][1],sh[3][0],0);g.addColorStop(0,'#d8fbff');g.addColorStop(.35,'#5fc8e6');g.addColorStop(1,'#1b3c63');x.fillStyle=g;x.fill();
  x.beginPath();x.moveTo(...sh[2]);x.lineTo(...sh[3]);x.lineTo(...sh[4]);x.closePath();x.fillStyle='rgba(10,20,50,.45)';x.fill();
  x.strokeStyle='rgba(220,255,255,.7)';x.lineWidth=1.5;x.beginPath();x.moveTo(...sh[1]);x.lineTo(...sh[2]);x.stroke();});
 x.globalCompositeOperation='lighter';const gg=x.createRadialGradient(-10,-80,4,-10,-80,150);gg.addColorStop(0,`rgba(140,240,255,${.25+ORE.glow*.6})`);gg.addColorStop(1,'rgba(140,240,255,0)');x.fillStyle=gg;x.fillRect(-170,-240,330,260);
 x.strokeStyle=`rgba(230,255,255,${.6+ORE.glow*.4})`;x.lineWidth=2;for(const c of ORE.crack){x.beginPath();x.moveTo(-28+c[0][0],-70+c[0][1]);c.forEach(p=>x.lineTo(-28+p[0],-70+p[1]));x.stroke();}
 x.globalCompositeOperation='source-over';
 x.fillStyle='#22171f';for(const [a,b,r] of [[-95,4,16],[-60,8,12],[45,6,15],[78,3,11],[-5,9,13]]){x.beginPath();x.ellipse(a,b,r*1.4,r*.7,0,0,7);x.fill();}
 x.restore();}
function limb(a,b,w,col){x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';x.beginPath();x.moveTo(...a);x.lineTo(...b);x.stroke();}
function hero(t,p){const br=reduced?0:Math.sin(t*.0025);const r=rig(p,br);const fB=[CX-34,GY],fF=[CX+30,GY];

 limb(r.hip,kB,17,'#2a2235');limb(kB,fB,14,'#2a2235');x.fillStyle='#1a1422';x.beginPath();x.ellipse(fB[0]+6,GY-4,15,6,0,0,7);x.fill();

 const pd=dir(r.ta+Math.PI/2);x.fillStyle='#9aa3b8';x.beginPath();x.moveTo(r.tip[0]-pd[0]*26,r.tip[1]-pd[1]*26);x.quadraticCurveTo(r.tip[0]+dir(r.ta)[0]*10,r.tip[1]+dir(r.ta)[1]*10,r.tip[0]+pd[0]*30,r.tip[1]+pd[1]*30);x.lineTo(r.tip[0],r.tip[1]);x.closePath();x.fill();x.strokeStyle=rim;x.lineWidth=2;x.stroke();
 x.save();x.translate(...r.hip);x.rotate(p.lean);
 const cg=x.createLinearGradient(-26,0,26,0);cg.addColorStop(0,'#3d2e46');cg.addColorStop(.6,'#5a3f55');cg.addColorStop(1,'#7c5a6e');x.fillStyle=cg;
 x.beginPath();x.moveTo(-24,14);x.quadraticCurveTo(-30,-40,-20,-76);x.lineTo(20,-76);x.quadraticCurveTo(30,-40,26,14+Math.sin(t*.004)*2-p.lean*8);x.quadraticCurveTo(0,22,-24,14);x.fill();
 x.strokeStyle=rim;x.lineWidth=2.5;x.beginPath();x.moveTo(20,-76);x.quadraticCurveTo(30,-40,26,14-p.lean*8);x.stroke();

 x.fillStyle='#2b2236';x.beginPath();x.moveTo(-22,-12);x.quadraticCurveTo(0,-40,22,-12);x.lineTo(26,-9);x.lineTo(-22,-9);x.fill();x.fillStyle='#c9a24a';x.fillRect(-4,-30,8,8);

function particles(z){for(const q of parts){if(q.z!==z)continue;const a=clamp(q.life/q.max,0,1);
 if(q.kind==='dust'){const g=x.createRadialGradient(q.x,q.y,0,q.x,q.y,q.r);g.addColorStop(0,`rgba(200,170,190,${a*.35})`);g.addColorStop(1,'rgba(200,170,190,0)');x.fillStyle=g;x.fillRect(q.x-q.r,q.y-q.r,q.r*2,q.r*2);}
